name: openledger
description: "Offline-first, AI-native accounting app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.28
  sqlcipher_flutter_libs: ^0.6.5
  sqlite3: ^2.4.0
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.0
  http: ^1.4.0
  pdf: ^3.11.2
  flutter_secure_storage: ^9.2.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: launcher_icon
  ios: true
  adaptive_icon_background: "#14285A"
  adaptive_icon_foreground: assets/icon/app_icon.png
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
